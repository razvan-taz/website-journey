spring.application.name=backend

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App base URL (used in email links)
app.base-url=http://localhost:4200
app.mail.from=noreply@journey.com

# JWT configuration
# Override this in production with a strong secret (min 32 chars, ideally 64+)
jwt.secret=change-me-in-production-use-a-long-secret-key-at-least-32-chars
jwt.expiration-ms=86400000
