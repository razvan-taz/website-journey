spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/website_journey
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: noreply@journey.com
  base-url: http://localhost:4200

stripe:
  secret-key: sk_test_YOUR_SECRET_KEY_HERE
  publishable-key: pk_test_YOUR_PUBLISHABLE_KEY_HERE
  webhook-secret: whsec_YOUR_WEBHOOK_SECRET_HERE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
