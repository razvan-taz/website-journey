spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/website_journey
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # SMTP config is now managed in the database (email_config table).
  # The DynamicMailSender loads settings at runtime via EmailConfigService.
  # The spring.mail.* properties below are intentionally left absent.

app:
  base-url: http://localhost:4200
  mail:
    from: noreply@journey.com

# Encryption key for sensitive fields stored in the database (e.g. SMTP password).
# Override ENCRYPTION_KEY in production with a strong random 32+ character secret.
encryption:
  secret-key: ${ENCRYPTION_KEY:default-dev-key-32-chars!!!!!!!!}

# JWT configuration
# Override JWT_SECRET in production with a strong secret (min 32 chars, ideally 64+)
jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-a-long-secret-key-at-least-32-chars}
  expiration-ms: 86400000

stripe:
  secret-key: sk_test_YOUR_SECRET_KEY_HERE
  publishable-key: pk_test_YOUR_PUBLISHABLE_KEY_HERE
  webhook-secret: whsec_YOUR_WEBHOOK_SECRET_HERE

# CORS allowed origins — comma-separated list, override in production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
