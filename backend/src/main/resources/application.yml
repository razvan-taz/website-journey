spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/website_journey
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # SMTP config is now managed in the database (email_config table).
  # The DynamicMailSender loads settings at runtime via EmailConfigService.
  # The spring.mail.* properties below are intentionally left absent.

app:
  base-url: http://localhost:4200

stripe:
  secret-key: sk_test_YOUR_SECRET_KEY_HERE
  publishable-key: pk_test_YOUR_PUBLISHABLE_KEY_HERE
  webhook-secret: whsec_YOUR_WEBHOOK_SECRET_HERE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
