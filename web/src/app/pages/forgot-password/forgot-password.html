<div class="fp-page">
  <div class="fp-card">

    @if (!submitted()) {

      <h1 class="fp-title">Forgot Password</h1>
      <p class="fp-subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="form-group">
        <label for="fp-email">Email address</label>
        <input
          id="fp-email"
          type="email"
          placeholder="you@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          (keydown.enter)="submit()"
          autocomplete="email" />
      </div>

      @if (error()) {
        <p class="fp-error" role="alert">{{ error() }}</p>
      }

      <button
        class="btn-submit"
        (click)="submit()"
        [disabled]="!email().trim() || submitting()">
        {{ submitting() ? 'Sending...' : 'Send Reset Link' }}
      </button>

    } @else {

      <div class="fp-success" role="status">
        <span class="fp-success-icon">✓</span>
        <h2 class="fp-success-title">Check your email</h2>
        <p class="fp-success-text">
          If an account exists for that address, you'll receive a password reset link shortly.
        </p>
      </div>

    }

    <p class="fp-back">
      <a routerLink="/" (click)="$event.preventDefault()" class="fp-back-link" onclick="history.back()">← Back to Sign In</a>
    </p>

  </div>
</div>
