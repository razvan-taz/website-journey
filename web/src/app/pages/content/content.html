@if (loading()) {
  <p class="feed-loading">Loading articles...</p>
} @else if (error()) {
  <p class="feed-error">{{ error() }}</p>
} @else {
  <h1 class="feed-title">Content</h1>

  <div class="card-grid">
    @for (post of posts(); track post.slug) {
      <article class="card" [routerLink]="['/content', post.slug]">
        <div class="card-thumbnail">
          <img [src]="post.thumbnailUrl" [alt]="post.title" loading="lazy" width="400" height="225" />
        </div>

        <div class="card-body">
          <span class="card-tag">{{ post.tag }}</span>

          <h3 class="card-title">{{ post.title }}</h3>

          <footer class="card-meta">
            <span class="card-author">{{ post.author }}</span>
            <span class="card-date">{{ post.publishDate }}</span>
          </footer>
        </div>
      </article>
    }
  </div>

  @if (hasMore()) {
    <div class="load-more-container">
      <button class="btn-load-more" (click)="loadMore()" [disabled]="loadingMore()">
        {{ loadingMore() ? 'Loading...' : 'Load More' }}
      </button>
    </div>
  }
}
