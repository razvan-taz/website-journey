<div class="admin-page">
  <div class="page-header">
    <h1 class="page-title">{{ isEdit() ? 'Edit Product' : 'New Product' }}</h1>
    <a routerLink="/admin/products" class="btn-back">← Back</a>
  </div>

  @if (loadingData()) {
    <p class="admin-loading">Loading...</p>
  } @else {
    @if (error()) { <p class="form-error">{{ error() }}</p> }

    <div class="admin-form">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [value]="name()" (input)="name.set($any($event.target).value)" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <input type="text" [value]="category()" (input)="category.set($any($event.target).value)" />
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" step="0.01" min="0" [value]="price()" (input)="price.set(+$any($event.target).value)" />
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" min="0" [value]="stock()" (input)="stock.set(+$any($event.target).value)" />
        </div>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [value]="imageUrl()" (input)="imageUrl.set($any($event.target).value)" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea rows="8" [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-save" (click)="save()" [disabled]="loading()">
          {{ loading() ? 'Saving...' : (isEdit() ? 'Update Product' : 'Create Product') }}
        </button>
      </div>
    </div>
  }
</div>
