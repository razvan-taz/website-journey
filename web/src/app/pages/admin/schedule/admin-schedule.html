<div class="admin-page">
  <div class="page-header">
    <h1 class="page-title">Stream Schedule</h1>
    <button class="btn-save" (click)="save()" [disabled]="saving() || loading()">
      {{ saving() ? 'Saving...' : 'Save' }}
    </button>
  </div>

  @if (success()) {
    <p class="admin-success">Schedule saved successfully.</p>
  }
  @if (error()) {
    <p class="admin-error">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="admin-loading">Loading...</p>
  } @else {
    <div class="schedule-rows">
      @for (entry of editableEntries(); track entry.dayOfWeek) {
        <div class="schedule-row">
          <label class="day-label">{{ entry.dayName }}</label>
          <div class="schedule-fields">
            <input
              type="text"
              class="schedule-input start-time-input"
              [value]="entry.startTime"
              (input)="filterStartTime($event, entry.dayOfWeek)"
              placeholder="23:01"
              maxlength="5"
            />
            <input
              type="text"
              class="schedule-input end-time-input"
              [value]="entry.endTime"
              (input)="filterEndTime($event, entry.dayOfWeek)"
              placeholder="e.g. midnight, 02:00"
            />
            <input
              type="text"
              class="schedule-input description-input"
              [value]="entry.description"
              (input)="updateField(entry.dayOfWeek, 'description', $any($event.target).value)"
              placeholder="Stream description"
            />
          </div>
        </div>
      }
    </div>
  }
</div>
