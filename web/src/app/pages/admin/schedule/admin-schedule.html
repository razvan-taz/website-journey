<div class="admin-page">
  <div class="page-header">
    <h1 class="page-title">Stream Schedule</h1>
    <button class="btn-save" (click)="save()" [disabled]="saving() || loading()">
      {{ saving() ? 'Saving...' : 'Save' }}
    </button>
  </div>

  @if (success()) {
    <p class="admin-success">Schedule saved successfully.</p>
  }
  @if (error()) {
    <p class="admin-error">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="admin-loading">Loading...</p>
  } @else {
    <div class="schedule-rows">
      @for (entry of editableEntries(); track entry.dayOfWeek) {
        <div class="schedule-row">
          <label class="day-label">{{ entry.dayName }}</label>
          <input
            type="text"
            class="content-input"
            [value]="entry.content"
            (input)="updateContent(entry.dayOfWeek, $any($event.target).value)"
            placeholder="e.g. WoW from 8pm, or Off"
          />
        </div>
      }
    </div>
  }
</div>
