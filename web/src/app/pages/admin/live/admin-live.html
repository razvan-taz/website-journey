<div class="admin-page">
  <div class="page-header">
    <h1 class="page-title">Live Status</h1>
  </div>

  @if (loading()) {
    <p class="admin-loading">Loading...</p>
  } @else {
    <div class="live-form">
      @if (error()) {
        <p class="admin-error">{{ error() }}</p>
      }

      <div class="form-row">
        <label class="form-label">Show button on site</label>
        <input
          type="checkbox"
          [checked]="status().enabled"
          (change)="updateField('enabled', $any($event.target).checked)"
        />
      </div>

      <div class="form-row">
        <label class="form-label">Stream URL</label>
        <input
          type="url"
          class="form-input"
          [value]="status().url"
          (input)="updateField('url', $any($event.target).value)"
          placeholder="https://live.example.com"
        />
      </div>

      <div class="form-row">
        <label class="form-label">Status</label>
        <div class="status-toggle">
          <button
            class="btn-status"
            [class.btn-status--active]="!status().live"
            (click)="updateField('live', false)"
          >
            Offline
          </button>
          <button
            class="btn-status"
            [class.btn-status--live]="status().live"
            (click)="updateField('live', true)"
          >
            Live
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-save" (click)="save()" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
        @if (success()) {
          <span class="saved-indicator">Saved</span>
        }
      </div>
    </div>
  }
</div>
