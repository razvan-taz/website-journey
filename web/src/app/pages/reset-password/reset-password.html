<div class="rp-page">
  <div class="rp-card">

    @if (done()) {

      <div class="rp-success" role="status">
        <span class="rp-success-icon">✓</span>
        <h2 class="rp-success-title">Password updated</h2>
        <p class="rp-success-text">Your password has been changed. You can now sign in with your new password.</p>
        <a routerLink="/" class="btn-home">Back to Home</a>
      </div>

    } @else {

      <h1 class="rp-title">Reset Password</h1>
      <p class="rp-subtitle">Enter your new password below.</p>

      <div class="form-group">
        <label for="rp-password">New Password</label>
        <div class="input-wrap">
          <input
            id="rp-password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="At least 8 characters"
            [value]="newPassword()"
            (input)="newPassword.set($any($event.target).value)"
            autocomplete="new-password" />
          <button type="button" class="btn-toggle-pw" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>
      @if (newPasswordStrength().score > 0) {
        <div class="pw-strength">
          <div class="pw-strength-bar">
            <div class="pw-strength-fill" [style.width.%]="newPasswordStrength().score * 20" [class]="'pw-strength-fill--' + newPasswordStrength().score"></div>
          </div>
          <span class="pw-strength-label" [class]="'pw-strength-label--' + newPasswordStrength().score">{{ newPasswordStrength().label }}</span>
        </div>
      }

      <div class="form-group">
        <label for="rp-confirm">Confirm Password</label>
        <input
          id="rp-confirm"
          type="password"
          placeholder="Repeat new password"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          (keydown.enter)="submit()"
          autocomplete="new-password" />
      </div>

      @if (error()) {
        <p class="rp-error" role="alert">{{ error() }}</p>
      }

      <button
        class="btn-submit"
        (click)="submit()"
        [disabled]="!newPassword() || !confirmPassword() || submitting() || !token()">
        {{ submitting() ? 'Updating...' : 'Set New Password' }}
      </button>

    }

  </div>
</div>
